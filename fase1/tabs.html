<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .tabContainer {
            width: 100%;
            height: 350px;
        }

        .buttonContainer {
            height: 15%;
        }

        .tabContainer .buttonContainer button {
            width: 25%;
            height: 100%;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px;
            font-family: sans-serif;
            font-size: 18px;
            background-color: pink;
        }

        .tabContainer .buttonContainer button:hover {
            background-color: blue;
        }

        .tabContainer .tabPanel {
            height: 85%;
            background-color: #eee;
            color: white;
            text-align: center;
            padding-top: 105px;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 22px;
            display: none;
        }
    </style>

</head>

<body>


    <div class="tabContainer">
        <div class="buttonContainer">
            <button class="tabButton" id="1">Tab1</button>
            <button class="tabButton" id="2">Tab2</button>
            <button class="tabButton" id="3">Tab3</button>
            <button class="tabButton" id="4">Tab4</button>
        </div>
        <div class="tabPanel">Tab1:content</div>
        <div class="tabPanel">Tab2:content</div>
        <div class="tabPanel">Tab3:content</div>
        <div class="tabPanel">Tab4:content</div>
    </div>

    <script src="tabs.js"></script>

</body>

</html>
